[package]
name = "gearhub-core-wasm"
version = "0.1.0"
edition = "2024"
description = "wasm-bindgen bridge for gearhub-core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gearhub-core = { path = "../core" }
js-sys = "0.3"
serde = "1"
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"
