<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Diagnóstico RAWM — OmniGear</title>
    <script>
      // Matches the theme bootstrap in index.html so the probe does not flash.
      (function () {
        try {
          var stored = localStorage.getItem('omnigear:tema');
          var dark = stored
            ? stored === 'escuro'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (error) {
          // Storage may be blocked; the page still renders in the light theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/diagnostico.tsx"></script>
  </body>
</html>
