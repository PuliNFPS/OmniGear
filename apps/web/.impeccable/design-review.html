<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OmniGear — Biblioteca de design</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111112;
        --panel: #181819;
        --line: #313133;
        --text: #f4f4f4;
        --muted: #aaa;
        --active: #eee;
        --on-active: #141414;
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f5f5f3;
        --panel: #fff;
        --line: #d9d9d5;
        --text: #171717;
        --muted: #62625e;
        --active: #202020;
        --on-active: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      button,
      a,
      input {
        font: inherit;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 4px;
      }
      .skip {
        position: fixed;
        top: -70px;
        left: 20px;
        padding: 12px;
        background: var(--active);
        color: var(--on-active);
        z-index: 5;
      }
      .skip:focus {
        top: 12px;
      }
      header {
        height: 82px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        gap: 20px;
      }
      .brand {
        font-size: 22px;
        letter-spacing: -1px;
        font-weight: 750;
      }
      .brand span {
        font-weight: 350;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .icon-button {
        width: 44px;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: transparent;
        color: var(--text);
      }
      .icon-button svg {
        width: 19px;
        height: 19px;
      }
      .shell {
        display: grid;
        grid-template-columns: 255px minmax(0, 1fr);
        min-height: calc(100vh - 82px);
      }
      aside {
        padding: 24px 16px;
        border-right: 1px solid var(--line);
      }
      .search {
        padding: 10px 12px;
        width: 100%;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        border-radius: 7px;
        margin-bottom: 15px;
      }
      nav h2 {
        margin: 24px 12px 7px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      nav button {
        width: 100%;
        min-height: 40px;
        border: 0;
        background: transparent;
        color: var(--muted);
        text-align: left;
        padding: 9px 12px;
        border-radius: 6px;
        margin: 2px 0;
        font-size: 13px;
      }
      nav button:hover {
        background: var(--panel);
        color: var(--text);
      }
      nav button[aria-current='true'] {
        background: var(--active);
        color: var(--on-active);
      }
      main {
        min-width: 0;
        padding: 34px clamp(18px, 3vw, 48px) 64px;
      }
      .intro {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 24px;
      }
      .intro h1 {
        font-size: clamp(25px, 3vw, 38px);
        font-weight: 550;
        letter-spacing: -1.2px;
        margin: 6px 0 12px;
      }
      .intro p {
        margin: 0;
        max-width: 700px;
        color: var(--muted);
      }
      .counter {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        padding-top: 8px;
      }
      .toolbar {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
        margin: 24px 0 18px;
      }
      .small-button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        min-height: 42px;
        padding: 10px 14px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .small-button:hover {
        background: var(--panel);
      }
      .small-button:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .status {
        margin-right: auto;
        font-size: 12px;
        color: var(--muted);
      }
      figure {
        margin: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
      }
      figcaption {
        padding: 15px 18px;
        font-size: 12px;
        color: var(--muted);
        border-top: 1px solid var(--line);
      }
      .notes {
        margin-top: 22px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 12px;
      }
      .empty-search {
        padding: 12px;
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
      @media (min-width: 900px) {
        aside {
          height: calc(100vh - 82px);
          position: sticky;
          top: 0;
          overflow: auto;
        }
      }
      @media (max-width: 760px) {
        header {
          padding: 0 18px;
          height: 70px;
        }
        .header-right .eyebrow {
          display: none;
        }
        .shell {
          display: block;
        }
        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding: 15px;
        }
        nav {
          max-height: 200px;
          overflow: auto;
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0 12px;
        }
        nav h2 {
          margin-top: 12px;
        }
        .search {
          margin: 0;
        }
        main {
          padding-top: 24px;
        }
        .intro {
          gap: 12px;
        }
        .counter {
          font-size: 12px;
        }
        .status {
          flex-basis: 100%;
          margin-bottom: 5px;
        }
        .small-button {
          min-height: 44px;
        }
        .notes {
          display: block;
        }
        .notes a {
          display: inline-block;
          margin-top: 12px;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#content">Ir para a prancha</a>
    <header>
      <div>
        <div class="brand">omni<span>gear</span></div>
        <div class="eyebrow">Biblioteca de design</div>
      </div>
      <div class="header-right">
        <span class="eyebrow" id="total"></span
        ><button
          class="icon-button"
          id="theme"
          aria-label="Ativar tema claro"
          title="Ativar tema claro"
        ></button>
      </div>
    </header>
    <div class="shell">
      <aside>
        <label class="eyebrow" for="search">Encontrar uma tela</label
        ><input class="search" id="search" type="search" placeholder="Buscar no design…" />
        <nav aria-label="Pranchas de design" id="nav"></nav>
      </aside>
      <main id="content" tabindex="-1">
        <div class="intro">
          <div>
            <div class="eyebrow" id="group"></div>
            <h1 id="title"></h1>
            <p id="description"></p>
          </div>
          <span class="counter" id="counter"></span>
        </div>
        <div class="toolbar">
          <span class="status" id="status"></span
          ><button class="small-button" id="previous" aria-label="Prancha anterior">
            ← Anterior</button
          ><button class="small-button" id="next" aria-label="Próxima prancha">Próxima →</button
          ><a class="small-button" id="original" target="_blank" rel="noopener">Ampliar imagem ↗</a>
        </div>
        <figure>
          <img id="board" alt="" />
          <figcaption>
            Temas claro e escuro na mesma prancha. Prévia estática: os controles desenhados não são
            interativos.
          </figcaption>
        </figure>
        <div class="notes">
          <span>Composições escolhidas + estados complementares · 05 set 2026</span
          ><a href="design-handoff.md">Guia para implementação ↗</a
          ><a id="prompt" target="_blank" rel="noopener">Prompt da imagem ↗</a>
        </div>
      </main>
    </div>
    <script>
      const catalog = [{"id":"home","group":"Início","title":"Seus dispositivos","image":"mocks/revised/home-icone-tema.png","description":"Home com lista de dispositivos e prévia do periférico selecionado. Composição 1 escolhida, com tema por ícone.","status":"Composição escolhida"},{"id":"home-vazia","group":"Início","title":"Primeiro acesso","image":"mocks/estados/home-vazia.png","description":"Home sem dispositivos, com adicionar dispositivo e acesso à demonstração.","status":"Estado complementar"},{"id":"adicionar","group":"Início","title":"Adicionar dispositivo","image":"mocks/adicionar/adicionar-1-modal.png","description":"Opção 1 escolhida: janela central com instruções antes da seleção nativa do navegador.","status":"Composição escolhida"},{"id":"botoes","group":"Mouse","title":"Botões","image":"mocks/revised/botoes-contextual-geral-icone-tema.png","description":"Opção 3: seleção no mouse e edição contextual da atribuição.","status":"Composição escolhida"},{"id":"dpi","group":"Mouse","title":"DPI","image":"mocks/dpi/dpi-2-linhas.png","description":"Opção 2: estágios organizados em linhas para comparar e ajustar a sensibilidade.","status":"Composição escolhida"},{"id":"desempenho","group":"Mouse","title":"Desempenho","image":"mocks/desempenho/desempenho-3-mouse.png","description":"Opção 3: periférico em destaque com controles de desempenho ao redor.","status":"Composição escolhida"},{"id":"parametros","group":"Mouse","title":"Parâmetros","image":"mocks/parametros/parametros-1-paineis.png","description":"Opção 1: ajustes em painéis, com controle visual de rotação do sensor.","status":"Composição escolhida"},{"id":"leviathan-desempenho-modos","group":"Mouse · Leviathan V4","title":"Modos de desempenho","image":"mocks/leviathan-v4/desempenho-modos.png","description":"Tela atual preservada, adicionando Modo de desempenho ao lado da taxa de reporte e sem divisória.","status":"Composição aprovada"},{"id":"leviathan-turbo-sem-fio","group":"Mouse · Leviathan V4","title":"Turbo sem fio","image":"mocks/leviathan-v4/parametros-turbo-sem-fio.png","description":"Proposta que corrige Alcance estendido e explicita a otimização do receptor 2,4 GHz.","status":"Composição aprovada"},{"id":"leviathan-r-plus","group":"Mouse · Leviathan V4","title":"Camada R-Plus","image":"mocks/leviathan-v4/botoes-r-plus.png","description":"Proposta de R-Plus dentro de Botões, com seleção do ativador e edição da camada secundária.","status":"Composição aprovada"},{"id":"mouse-perfis","group":"Mouse","title":"Perfis do mouse","image":"mocks/perfis/perfis-3-slots.png","description":"Opção 3: slots em grade, com distinção entre perfil em uso e perfis disponíveis.","status":"Composição escolhida"},{"id":"mouse-geral","group":"Mouse","title":"Geral do mouse","image":"mocks/geral/geral-1-mouse.png","description":"Opção 1: mouse à esquerda e informações e ações à direita.","status":"Composição escolhida"},{"id":"teclas","group":"Teclado","title":"Teclas","image":"mocks/teclas/teclas-1-contextual.png","description":"Opção 1: seleção de tecla na prévia e edição contextual da atribuição.","status":"Composição escolhida"},{"id":"iluminacao","group":"Teclado","title":"Iluminação","image":"mocks/iluminacao/iluminacao-3-efeitos.png","description":"Opção 3: lista de efeitos à esquerda e ajustes de iluminação global.","status":"Composição escolhida"},{"id":"teclado-perfis","group":"Teclado","title":"Perfis do teclado","image":"mocks/teclado-complementos/teclado-perfis-corrigido.png","description":"Adaptação da grade escolhida para mouse, com resumo de remapeamentos e iluminação.","status":"Adaptação da composição"},{"id":"teclado-geral","group":"Teclado","title":"Geral do teclado","image":"mocks/teclado-complementos/teclado-geral.png","description":"Adaptação da composição de Geral para a proporção horizontal do teclado.","status":"Adaptação da composição"},{"id":"home-estados","group":"Estados","title":"Carregamento e desconexão","image":"mocks/estados/home-estados.png","description":"Carregamento da lista e dispositivo desconectado com ação de reconexão.","status":"Estado complementar"},{"id":"conexao-resultados","group":"Estados","title":"Resultados da conexão","image":"mocks/estados/conexao-resultados.png","description":"Conectando, dispositivo conectado e seleção cancelada.","status":"Estado complementar"},{"id":"conexao-erros","group":"Estados","title":"Erros de conexão","image":"mocks/estados/conexao-erros.png","description":"Permissão negada, modelo não suportado e navegador sem recurso necessário.","status":"Estado complementar"},{"id":"salvamento","group":"Estados","title":"Aplicação e salvamento","image":"mocks/estados/salvamento-conexao.png","description":"Aplicando, salvando, salvo, falha ao salvar e perda de conexão com rascunho preservado.","status":"Estado complementar"},{"id":"confirmacoes","group":"Estados","title":"Confirmações","image":"mocks/estados/confirmacoes.png","description":"Descartar alterações, restaurar perfil atual, trocar perfil e revisar importação.","status":"Estado complementar"},{"id":"validacao","group":"Estados","title":"Validação dos ajustes","image":"mocks/estados/ajustes-validacao-final.png","description":"Eixos X/Y independentes, DPI inválido, efeito animado e iluminação desligada.","status":"Estado complementar"},{"id":"arquivos","group":"Estados","title":"Arquivos e nomes de perfis","image":"mocks/estados/arquivos-perfis-final.png","description":"Arquivo incompatível, escolha do conteúdo a exportar e nome de perfil inválido.","status":"Estado complementar"},{"id":"responsivo-home","group":"Telas menores","title":"Home em tela menor","image":"mocks/estados/responsivo-home.png","description":"Lista e prévia empilhadas, com ações de conexão acessíveis.","status":"Adaptação responsiva"},{"id":"responsivo-editores","group":"Telas menores","title":"Editores em tela menor","image":"mocks/estados/responsivo-editores.png","description":"Menu recolhido, periférico acima do editor e ampliação da prévia do teclado.","status":"Adaptação responsiva"}];
      const $ = (id) => document.getElementById(id);
      let index = 0;
      const moon =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M21 13a9 9 0 0 1-10-10A9 9 0 1 0 21 13Z"/></svg>';
      const sun =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>';
      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        const action = theme === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro';
        $('theme').innerHTML = theme === 'dark' ? moon : sun;
        $('theme').setAttribute('aria-label', action);
        $('theme').title = action;
        try {
          localStorage.setItem('omnigear-gallery-theme', theme);
        } catch {}
      }
      $('theme').onclick = () =>
        setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      let initialTheme = 'dark';
      try {
        initialTheme = localStorage.getItem('omnigear-gallery-theme') || 'dark';
      } catch {}
      setTheme(initialTheme === 'light' ? 'light' : 'dark');
      function renderNav() {
        const query = $('search').value.toLocaleLowerCase('pt-BR');
        $('nav').replaceChildren();
        let found = 0;
        for (const group of [...new Set(catalog.map((x) => x.group))]) {
          const items = catalog.filter(
            (x) =>
              x.group === group &&
              (x.title + ' ' + x.group + ' ' + x.description)
                .toLocaleLowerCase('pt-BR')
                .includes(query),
          );
          if (!items.length) continue;
          const section = document.createElement('section');
          const heading = document.createElement('h2');
          heading.textContent = group;
          section.append(heading);
          for (const item of items) {
            const button = document.createElement('button');
            button.textContent = item.title;
            button.setAttribute('aria-current', String(catalog[index].id === item.id));
            button.onclick = () => {
              location.hash = item.id;
            };
            section.append(button);
            found++;
          }
          $('nav').append(section);
        }
        if (!found) {
          const message = document.createElement('p');
          message.className = 'empty-search';
          message.textContent = 'Nenhuma prancha encontrada.';
          $('nav').append(message);
        }
      }
      function show() {
        const requested = location.hash.slice(1);
        index = Math.max(
          0,
          catalog.findIndex((x) => x.id === requested),
        );
        const item = catalog[index];
        $('group').textContent = item.group;
        $('title').textContent = item.title;
        $('description').textContent = item.description;
        $('status').textContent = item.status;
        $('counter').textContent = String(index + 1).padStart(2, '0') + ' / ' + catalog.length;
        $('board').src = item.image;
        $('board').alt = item.title + ' — estudos da interface OmniGear em temas claro e escuro';
        $('original').href = item.image;
        $('prompt').href = item.image.replace(/\.png$/, '.json');
        $('previous').disabled = index === 0;
        $('next').disabled = index === catalog.length - 1;
        document.title = item.title + ' — OmniGear Design';
        renderNav();
      }
      $('previous').onclick = () => {
        if (index > 0) location.hash = catalog[index - 1].id;
      };
      $('next').onclick = () => {
        if (index < catalog.length - 1) location.hash = catalog[index + 1].id;
      };
      $('search').addEventListener('input', renderNav);
      window.addEventListener('hashchange', show);
      $('total').textContent = catalog.length + ' pranchas · claro e escuro';
      show();
    </script>
  </body>
</html>
